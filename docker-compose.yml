services:
  web:
    build:
      context: .
    ports:
      - "127.0.0.1:${APP_PORT:-4173}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://relay:relay@postgres:5432/relay
      RELAY_MODE: ${RELAY_MODE:-live}
      RELAY_SEED: ${RELAY_SEED:-0}
      RELAY_AUTH_TOKENS: ${RELAY_AUTH_TOKENS:-}
      RELAY_AUTH_TOKENS_FILE: ${RELAY_AUTH_TOKENS_FILE:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      GITHUB_WEBHOOK_SECRET_FILE: ${GITHUB_WEBHOOK_SECRET_FILE:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 10
    restart: unless-stopped

  worker:
    build:
      context: ./backend
    command: ["python", "-m", "app.runtime.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg2://relay:relay@postgres:5432/relay
      RELAY_MODE: ${RELAY_MODE:-live}
      WORKER_POLL_SECONDS: "1"
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_TOKEN_FILE: ${GITHUB_TOKEN_FILE:-}
      GITHUB_DEFAULT_BRANCH: ${GITHUB_DEFAULT_BRANCH:-master}
      DEVIN_API_TOKEN: ${DEVIN_API_TOKEN:-}
      DEVIN_API_TOKEN_FILE: ${DEVIN_API_TOKEN_FILE:-}
      DEVIN_ORG_ID: ${DEVIN_ORG_ID:-}
      DEVIN_REVIEW_TOKEN: ${DEVIN_REVIEW_TOKEN:-}
      DEVIN_REVIEW_TOKEN_FILE: ${DEVIN_REVIEW_TOKEN_FILE:-}
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17.6-alpine3.22
    environment:
      POSTGRES_DB: relay
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
    volumes:
      - relay_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d relay"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  relay_postgres:
