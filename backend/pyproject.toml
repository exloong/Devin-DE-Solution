[project]
name = "relay-backend"
version = "0.1.0"
description = "Relay issue automation control plane: lifecycle core, persistence, and API"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.141.1",
    "pydantic==2.13.5",
    "sqlalchemy==2.0.52",
    "alembic==1.19.1",
    "psycopg2-binary==2.9.10",
    "uvicorn==0.52.4",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.5",
    "mypy==2.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
exclude-newer = "2026-08-30T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false
