services:
  api:
    environment:
      RELAY_AUTH_TOKENS: ""
      RELAY_AUTH_TOKENS_FILE: /run/secrets/relay_auth_tokens
      GITHUB_WEBHOOK_SECRET: ""
      GITHUB_WEBHOOK_SECRET_FILE: /run/secrets/github_webhook_secret
    secrets:
      - relay_auth_tokens
      - github_webhook_secret

  worker:
    environment:
      GITHUB_TOKEN: ""
      GITHUB_TOKEN_FILE: /run/secrets/github_token
      DEVIN_API_TOKEN: ""
      DEVIN_API_TOKEN_FILE: /run/secrets/devin_api_token
    secrets:
      - github_token
      - devin_api_token

secrets:
  relay_auth_tokens:
    file: ${RELAY_AUTH_TOKENS_FILE_HOST:?set RELAY_AUTH_TOKENS_FILE_HOST}
  github_webhook_secret:
    file: ${GITHUB_WEBHOOK_SECRET_FILE_HOST:?set GITHUB_WEBHOOK_SECRET_FILE_HOST}
  github_token:
    file: ${GITHUB_TOKEN_FILE_HOST:?set GITHUB_TOKEN_FILE_HOST}
  devin_api_token:
    file: ${DEVIN_API_TOKEN_FILE_HOST:?set DEVIN_API_TOKEN_FILE_HOST}
